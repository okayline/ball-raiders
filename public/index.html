<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BALL RAIDERS</title>
<style>
  body { margin: 0; background: #0b0d12; color: #e6e8ef; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; display: flex; justify-content: center; }
  main { width: 360px; padding: 12px 0 24px; }
  h1 { font-size: 18px; margin: 0 0 6px; letter-spacing: 2px; }
  .row { display: flex; justify-content: space-between; gap: 8px; margin: 4px 0; }
  .dim { color: #8a90a2; }
  canvas { display: block; background: #12151d; border: 1px solid #2a2f3d; cursor: crosshair; touch-action: none; }
  button { background: #1d2230; color: #e6e8ef; border: 1px solid #3a4152; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  input { background: #12151d; color: #e6e8ef; border: 1px solid #3a4152; font: inherit; padding: 5px; width: 120px; }
  #msg { min-height: 20px; margin: 6px 0; }
  .bank { color: #6be08a; } .trap { color: #ff6b6b; } .gold { color: #ffd166; }
</style>
</head>
<body>
<main>
  <h1>BALL RAIDERS</h1>
  <div class="row"><span>Stash <b id="stash" class="gold"></b></span><span>Balls <b id="balls"></b></span></div>
  <div class="row"><span>Carrying <b id="carry">-</b></span><span>Banked this run <b id="runBank"></b></span></div>
  <div class="row dim"><span>Board <b id="boardNo">1</b>/3</span><span>Prize hole next: <b id="prizes"></b></span></div>
  <canvas id="c" width="360" height="480"></canvas>
  <div id="msg" class="dim">Turn the handle (drag it up or down, scroll, or arrow keys), then tap it or press space to shoot. Each bump builds part of a new ball. BANK keeps it; going down risks it for more.</div>
  <div class="row">
    <button id="newRun">New run</button>
    <button id="buy">Use 1 stashed ball</button>
  </div>
  <div class="row dim"><label>Seed <input id="seed"></label><button id="useSeed">Use seed</button></div>
  <div class="dim" id="log"></div>
</main>
<script src="engine.js"></script>
<script>
(() => {
  const B = window.BallRaiders;
  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const BALL_COST = 100;  // one whole ball from the stash
  const SPEED = 0.75;     // how fast the ball plays back (was 3; kura asked for 1/4)
  const STORE = 'ball-raiders-stash';

  function load() { try { return Number(localStorage.getItem(STORE)) || 0; } catch (e) { return memStash; } }
  function save(v) { memStash = v; try { localStorage.setItem(STORE, String(v)); } catch (e) {} }
  let memStash = 0;

  let machine, state, balls, runBank, aims, aim = 16, playing = false, frames = [], fi = 0, extra = 0;

  function randomSeed() {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0].toString(36);
  }

  function newRun(seed) {
    machine = B.makeMachine(seed || randomSeed());
    state = { prizeIndex: 0, revealed: new Set() };
    balls = 3 + extra; extra = 0;
    runBank = 0; aims = [];
    $('seed').value = machine.seed;
    say('New run. Seed ' + machine.seed + '. Same seed = same machine, every time.', 'dim');
    $('log').textContent = '';
    ui(); draw(0, null);
  }

  function ui() {
    $('stash').textContent = B.money(load());
    $('balls').textContent = balls;
    $('runBank').textContent = B.money(runBank);
        const next = [0, 1].map(k => machine.prizes[(state.prizeIndex + k) % machine.prizes.length]);
    $('prizes').innerHTML = next.map(p => p === 'TRAP' ? '<span class="trap">TRAP</span>' : p).join(' → ') + ' → ?';
    $('buy').disabled = playing || load() < BALL_COST;
    $('newRun').disabled = playing;
  }

  function say(text, cls) { const m = $('msg'); m.textContent = text; m.className = cls || ''; }

  function draw(board, f) {
    const b = machine.boards[board];
    cx.clearRect(0, 0, B.W, B.H);
    if (b.round) return drawRound(b, f);
    // slots
    const sw = B.W / B.SLOTS;
    b.slots.forEach((k, i) => {
      cx.fillStyle = k === 'BANK' ? '#163a24' : '#2a2140';
      cx.fillRect(i * sw + 1, B.SLOT_Y, sw - 2, B.H - B.SLOT_Y);
      cx.fillStyle = k === 'BANK' ? '#6be08a' : '#b39dff';
      cx.font = '11px monospace'; cx.textAlign = 'center';
      cx.fillText(k, i * sw + sw / 2, B.H - 8);
    });
    // hole
    if (board === 1) {
      cx.strokeStyle = '#ffd166'; cx.lineWidth = 2;
      cx.beginPath(); cx.arc(B.HOLE.x, B.HOLE.y, B.HOLE.r, 0, 7); cx.stroke();
    }
    // pegs (traps are hidden until one has been hit this run)
    b.pegs.forEach((p, i) => {
      const shown = p.trap && state.revealed.has(board + ':' + i);
      cx.fillStyle = shown ? '#ff6b6b' : '#7c8399';
      cx.beginPath(); cx.arc(p.x, p.y, B.PEG_R, 0, 7); cx.fill();
    });
    // aim marker
    if (!playing) {
      cx.fillStyle = '#ffd166';
      cx.beginPath(); cx.arc(B.aimX(aim), 12, B.BALL_R, 0, 7); cx.fill();
    }
    if (f) {
      cx.fillStyle = f.done === 'trap' ? '#ff6b6b' : '#e6e8ef';
      cx.beginPath(); cx.arc(f.x, f.y, B.BALL_R, 0, 7); cx.fill();
    }
    cx.fillStyle = '#8a90a2'; cx.textAlign = 'left'; cx.font = '11px monospace';
    cx.fillText('B' + (board + 1) + '  ' + B.money(B.BIPS[board]) + '/bump', 6, 40);
    $('boardNo').textContent = board + 1;
  }

  const KNOB = { x: 322, y: 446, r: 20 };
  function drawCabinet(R) {
    cx.fillStyle = '#5b6170'; cx.fillRect(0, 0, B.W, B.H);           // the cabinet face
    cx.fillStyle = '#2b3350'; cx.beginPath(); cx.arc(R.cx, R.cy, R.r + 14, 0, 7); cx.fill();
    // the launch rail: up the right side, over the top
    cx.strokeStyle = '#c9ced9'; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(R.cx, R.cy, B.RAIL_R + 6, -Math.PI * 0.62, Math.PI * 0.22); cx.stroke();
    // the tray: balls you have left
    cx.fillStyle = '#1f8f86'; cx.fillRect(24, 428, 210, 40);
    cx.fillStyle = '#16655f'; cx.fillRect(30, 434, 198, 28);
    for (let i = 0; i < Math.min(balls, 16); i++) {
      cx.fillStyle = '#d7dbe6'; cx.beginPath(); cx.arc(40 + i * 12, 448, 5, 0, 7); cx.fill();
    }
    cx.fillStyle = '#9fe6dc'; cx.font = '9px monospace'; cx.textAlign = 'left';
    cx.fillText('tray', 30, 425);
    // the handle: turn it for a harder shot
    cx.fillStyle = '#1f8f86'; cx.beginPath(); cx.arc(KNOB.x, KNOB.y, KNOB.r + 6, 0, 7); cx.fill();
    cx.fillStyle = '#23305c'; cx.beginPath(); cx.arc(KNOB.x, KNOB.y, KNOB.r, 0, 7); cx.fill();
    const a0 = Math.PI * 0.75, a1 = a0 + Math.PI * 1.5 * (aim / (B.AIMS - 1));
    cx.strokeStyle = '#ffd166'; cx.lineWidth = 3;
    cx.beginPath(); cx.arc(KNOB.x, KNOB.y, KNOB.r + 3, a0, a1); cx.stroke();
    cx.strokeStyle = '#e6e8ef'; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(KNOB.x, KNOB.y); cx.lineTo(KNOB.x + Math.cos(a1) * (KNOB.r - 4), KNOB.y + Math.sin(a1) * (KNOB.r - 4)); cx.stroke();
    cx.fillStyle = '#e6e8ef'; cx.font = '9px monospace'; cx.textAlign = 'center';
    cx.fillText('power ' + Math.round((aim / (B.AIMS - 1)) * 100) + '%', KNOB.x - 4, 412);
  }

  function drawRound(b, f) {
    const R = b.round;
    drawCabinet(R);
    cx.fillStyle = '#1a1f2c'; cx.beginPath(); cx.arc(R.cx, R.cy, R.r, 0, 7); cx.fill();
    cx.strokeStyle = '#9aa3b8'; cx.lineWidth = 6; cx.beginPath(); cx.arc(R.cx, R.cy, R.r + 3, 0, 7); cx.stroke();
    // the screen: shows the prize line
    const sc = b.screen;
    cx.fillStyle = '#0e1a14'; cx.fillRect(sc.x, sc.y, sc.w, sc.h);
    cx.strokeStyle = '#6be08a'; cx.lineWidth = 2; cx.strokeRect(sc.x, sc.y, sc.w, sc.h);
    cx.fillStyle = '#6be08a'; cx.font = '11px monospace'; cx.textAlign = 'center';
    const next = [0, 1].map(k => machine.prizes[(state.prizeIndex + k) % machine.prizes.length]);
    cx.fillText('next prizes', sc.x + sc.w / 2, sc.y + 22);
    cx.font = '15px monospace';
    cx.fillText(next.join('  ') + '  ?', sc.x + sc.w / 2, sc.y + 46);
    // walls (screen outline, floor under the top hole, rails) and the closed gate
    cx.strokeStyle = '#4a5268'; cx.lineWidth = 2;
    b.walls.forEach(w => { cx.beginPath(); cx.moveTo(w.x1, w.y1); cx.lineTo(w.x2, w.y2); cx.stroke(); });
    cx.fillStyle = '#ffd166'; cx.fillRect(b.gate.x, b.gate.y, b.gate.w, b.gate.h);
    cx.font = '9px monospace'; cx.fillText('OPEN (closed for now)', b.gate.x + b.gate.w / 2, b.gate.y + 16);
    // pockets
    b.pockets.forEach(p => {
      cx.fillStyle = p.kind === 'BANK' ? '#163a24' : p.kind === 'DOWN' ? '#2a2140' : '#3a2f10';
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill();
      cx.fillStyle = p.kind === 'BANK' ? '#6be08a' : p.kind === 'DOWN' ? '#b39dff' : '#ffd166';
      cx.font = '8px monospace'; cx.fillText(p.kind === 'PRIZE' ? 'START' : p.kind, p.x, p.y + p.r + 9);
    });
    // nails and windmills
    b.pegs.forEach(p => {
      cx.fillStyle = p.windmill ? '#c9a227' : '#b8bccb';
      cx.beginPath(); cx.arc(p.x, p.y, p.r || B.PEG_R * 0.7, 0, 7); cx.fill();
    });
    cx.fillStyle = '#8a90a2'; cx.textAlign = 'left'; cx.font = '11px monospace';
    cx.fillText(B.money(B.BIPS[0]) + '/bump', 6, 16);

    if (f) { cx.fillStyle = f.done === 'trap' ? '#ff6b6b' : '#e6e8ef'; cx.beginPath(); cx.arc(f.x, f.y, B.BALL_R, 0, 7); cx.fill(); }
    $('boardNo').textContent = 1;
  }

  function drop() {
    if (playing || balls <= 0) return;
    playing = true; balls--; aims.push(aim); frames = []; fi = 0;
    const result = B.dropBall(machine, aim, state, f => frames.push(f));
    ui();
    const step = () => {
      fi = Math.min(frames.length - 1, fi + SPEED);   // physics ticks shown per screen frame
      const f = frames[Math.floor(fi)];
      draw(f.board, f);
      $('carry').textContent = B.money(f.bips);
      if (Math.floor(fi) < frames.length - 1) return requestAnimationFrame(step);
      finish(result);
    };
    requestAnimationFrame(step);
  }

  function finish(r) {
    playing = false;
    if (r.result === 'FOUL') {
      balls++;
      say('Too soft: the ball rolled back down the rail into the tray. Turn the handle up.', 'dim');
    } else if (r.result === 'BANK') {
      runBank += r.bips; save(load() + r.bips);
      say('Banked ' + B.money(r.bips) + ' on board ' + (r.board + 1) + '.', 'bank');
    } else {
      say((r.prize === 'TRAP' ? 'The prize hole was a TRAP. ' : 'Hit a trap. ') + 'Lost ' + B.money(r.lost) + '.', 'trap');
    }
    $('carry').textContent = '-';
    $('log').textContent = 'Shots so far (power): ' + aims.join(', ') + '. Seed ' + machine.seed + ' + these replays this run exactly.';
    if (balls <= 0) say($('msg').textContent + ' Run over: ' + B.money(runBank) + ' banked.', $('msg').className);
    ui(); draw(0, null);
  }

  let drag = null;
  function pos(e) {
    const rect = cv.getBoundingClientRect();
    return { x: ((e.clientX - rect.left) / rect.width) * B.W, y: ((e.clientY - rect.top) / rect.height) * B.H };
  }
  function setPower(p) { aim = Math.max(0, Math.min(B.AIMS - 1, p)); if (!playing) draw(0, null); }
  cv.addEventListener('pointerdown', e => {
    const p = pos(e), dx = p.x - KNOB.x, dy = p.y - KNOB.y;
    if (dx * dx + dy * dy > (KNOB.r + 10) * (KNOB.r + 10)) return;
    drag = { y: p.y, start: aim, moved: false };
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    const p = pos(e), d = Math.round((drag.y - p.y) / 4);   // drag up = harder
    if (d !== 0) drag.moved = true;
    setPower(drag.start + d);
  });
  cv.addEventListener('pointerup', () => { if (drag && !drag.moved) drop(); drag = null; });
  cv.addEventListener('wheel', e => { e.preventDefault(); setPower(aim + (e.deltaY < 0 ? 1 : -1)); }, { passive: false });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') setPower(aim + 1);
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') setPower(aim - 1);
    else if (e.key === ' ') { e.preventDefault(); drop(); }
  });
  $('newRun').onclick = () => newRun();
  $('useSeed').onclick = () => newRun($('seed').value.trim() || undefined);
  $('buy').onclick = () => {
    if (load() < BALL_COST) return;
    save(load() - BALL_COST); balls++; ui();
    say('Took a ball from your stash. If it drains, it is gone.', 'gold');
  };
  memStash = load();
  newRun();
})();
</script>
</body>
</html>
